name: binary-build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binary-build::${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_CACHE_SAVE: "true"

jobs:
  build-linux:
    name: Build Linux ${{ matrix.arch }} release binary
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Rust
        uses: ./.github/actions/setup-rust-ci
        with:
          cache-key: binary-build-${{ matrix.arch }}
          cache-workspace-crates: "true"
          save-cache: ${{ env.RUST_CACHE_SAVE }}

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package binary artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/interspire-mcp dist/interspire-mcp
          strip dist/interspire-mcp || true
          archive="interspire-mcp-linux-${{ matrix.arch }}.tar.gz"
          tar -C dist -czf "dist/${archive}" interspire-mcp
          (cd dist && sha256sum "${archive}" > "${archive}.sha256")

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.0
        with:
          name: interspire-mcp-linux-${{ matrix.arch }}
          path: |
            dist/interspire-mcp-linux-${{ matrix.arch }}.tar.gz
            dist/interspire-mcp-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
